<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Clone</title>
  <style>
    body {
      margin: 0;
      background: #70c5ce;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #70c5ce, #ffffff);
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: #fff;
      text-shadow: 2px 2px #000;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // Bird
    const bird = {
      x: 80,
      y: height / 2,
      radius: 20,
      color: 'yellow',
      velocity: 0,
      gravity: 0.8,
      jumpPower: -15
    };

    // Tubes
    let tubes = [];
    const tubeWidth = 80;
    const tubeGap = 200;
    let tubeFrequency = 120; // frames
    let frameCount = 0;
    let score = 0;

    function createTube() {
      const minHeight = 50;
      const maxHeight = height - tubeGap - 50;
      const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
      const bottomY = topHeight + tubeGap;
      const bottomHeight = height - bottomY;
      tubes.push({
        x: width,
        top: { y: 0, height: topHeight },
        bottom: { y: bottomY, height: bottomHeight },
        passed: false
      });
    }

    function jump() {
      bird.velocity = bird.jumpPower;
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') jump();
    });

    window.addEventListener('touchstart', e => {
      jump();
    });

    function detectCollision(bird, tube) {
      // Bird edges
      const bx = bird.x;
      const by = bird.y;
      const r = bird.radius;
      // Top tube
      if (bx + r > tube.x && bx - r < tube.x + tubeWidth && by - r < tube.top.height) return true;
      // Bottom tube
      if (bx + r > tube.x && bx - r < tube.x + tubeWidth && by + r > tube.bottom.y) return true;
      return false;
    }

    function update() {
      ctx.clearRect(0, 0, width, height);

      // Bird physics
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      if (bird.y + bird.radius > height) {
        alert("Game Over! Score: " + score);
        document.location.reload();
      }
      if (bird.y - bird.radius < 0) {
        bird.y = bird.radius;
        bird.velocity = 0;
      }

      // Draw bird
      ctx.fillStyle = bird.color;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Tubes
      if (frameCount % tubeFrequency === 0) createTube();
      tubes.forEach((tube, index) => {
        tube.x -= 5;
        // Draw top tube
        ctx.fillStyle = 'green';
        ctx.fillRect(tube.x, tube.top.y, tubeWidth, tube.top.height);
        // Draw bottom tube
        ctx.fillRect(tube.x, tube.bottom.y, tubeWidth, tube.bottom.height);

        // Collision
        if (detectCollision(bird, tube)) {
          alert("Game Over! Score: " + score);
          document.location.reload();
        }

        // Update score
        if (!tube.passed && tube.x + tubeWidth < bird.x) {
          score++;
          tube.passed = true;
        }

        // Remove offscreen tubes
        if (tube.x + tubeWidth < 0) {
          tubes.splice(index, 1);
        }
      });

      document.getElementById('score').innerText = "Score: " + score;

      frameCount++;
      requestAnimationFrame(update);
    }

    update();

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });
  </script>
</body>
</html>
