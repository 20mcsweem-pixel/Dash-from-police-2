<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark's Flappy Bird</title>
<style>
body { margin:0; overflow:hidden; background:#70c5ce; font-family:sans-serif;}
canvas { display:block; background: linear-gradient(to bottom,#70c5ce,#ffffff);}
#score,#highScore,#message{position:absolute; color:#fff; text-shadow:2px 2px #000;}
#score{top:10px; left:10px; font-size:24px;}
#highScore{top:50px; left:10px; font-size:20px;}
#message{top:30%; left:50%; transform:translate(-50%,-30%); text-align:center; z-index:10;}
button{font-size:20px; padding:8px 16px; margin-top:10px; cursor:pointer;}
input{font-size:18px; padding:5px; margin-top:10px;}
#leaderboardList { max-height:300px; overflow-y:auto; text-align:left; margin:10px 0; padding:5px; border:1px solid #fff; background:rgba(0,0,0,0.3); border-radius:5px;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="score">Score: 0</div>
<div id="highScore">High Score: 0</div>
<div id="message"></div>
<script>
// Canvas setup
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let width=window.innerWidth;
let height=window.innerHeight;
canvas.width=width;
canvas.height=height;

// Game variables
let gameState="start";
let score=0;
let tubeSpeed=3;
let highScore=localStorage.getItem('flappyHighScore')||0;

// Bird images
const birdImg=new Image();
birdImg.crossOrigin="anonymous";
birdImg.src='https://celebrateurbanbirds.org/wp-content/uploads/2016/08/rock-pigeon.png';

const birdFlapImg=new Image();
birdFlapImg.crossOrigin="anonymous";
birdFlapImg.src='https://static.pngtree.com/png-vector/20210710/ourmid/pngtree-pigeon-in-mid-flight-with-flapping-wings-png-image_3541772.png'; // Replace with flapping bird URL

const bird={x:80, y:height/2, radius:25, velocity:0, gravity:0.5, jumpPower:-6, flapping:false, flapTimer:0};

// Tubes/towers
let tubes=[];
const tubeWidth=80;
const tubeGap=200;
let tubeFrequency=120;
let frameCount=0;

// Clouds
let clouds=[];
for(let i=0;i<10;i++){
  clouds.push({x:Math.random()*width, y:Math.random()*height/2, radius:Math.random()*30+20, speed:0.3+Math.random()*0.5});
}

// Functions
function createTube(){
  const minHeight=50;
  const maxHeight=height-tubeGap-50;
  const topHeight=Math.random()*(maxHeight-minHeight)+minHeight;
  const bottomY=topHeight+tubeGap;
  const bottomHeight=height-bottomY;
  tubes.push({x:width, top:{y:0,height:topHeight}, bottom:{y:bottomY,height:bottomHeight}, passed:false});
}

function drawBird(){
  if(bird.flapping){
    ctx.drawImage(birdFlapImg,bird.x-bird.radius,bird.y-bird.radius,bird.radius*2,bird.radius*2);
  }else{
    ctx.drawImage(birdImg,bird.x-bird.radius,bird.y-bird.radius,bird.radius*2,bird.radius*2);
  }
}

function jump(){
  if(gameState==="playing"){
    bird.velocity=bird.jumpPower;
    bird.flapping=true;
    bird.flapTimer=5; // frames to show flapping image
  }
}

// Events
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){jump();}});
canvas.addEventListener('touchstart',e=>{if(gameState==="playing"){jump();}}, {passive:true});

// Collision
function detectCollision(b,tube){
  const bx=b.x, by=b.y, r=b.radius;
  if(bx+r>tube.x && bx-r<tube.x+tubeWidth && by-r<tube.top.height) return true;
  if(bx+r>tube.x && bx-r<tube.x+tubeWidth && by+r>tube.bottom.y) return true;
  return false;
}

// Draw tower pipes
function drawTube(tube){
  ctx.fillStyle='#228B22';
  // Top tube
  ctx.fillRect(tube.x,tube.top.y,tubeWidth,tube.top.height);
  // Bottom tower (cartoon)
  ctx.fillStyle='#8B4513';
  ctx.fillRect(tube.x,tube.bottom.y,tubeWidth,tube.bottom.height);
  ctx.fillStyle='#A0522D';
  ctx.fillRect(tube.x+10,tube.bottom.y+10,tubeWidth-20,tube.bottom.height-10);
  // 3D effect right side
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(tube.x+tubeWidth-10,tube.top.y,10,tube.top.height);
  ctx.fillRect(tube.x+tubeWidth-10,tube.bottom.y,10,tube.bottom.height);
}

// Draw clouds
function drawClouds(){
  ctx.fillStyle='rgba(255,255,255,0.8)';
  clouds.forEach(c=>{
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.radius,0,Math.PI*2);
    ctx.fill();
    c.x-=c.speed;
    if(c.x+c.radius<0) c.x=width+c.radius;
  });
}

// Game loop
function update(){
  ctx.clearRect(0,0,width,height);

  drawClouds();

  if(gameState==="start"){ showStartScreen(); requestAnimationFrame(update); return;}
  if(gameState==="playing"){
    bird.velocity+=bird.gravity;
    bird.y+=bird.velocity;

    if(bird.flapTimer>0){ bird.flapTimer--; }
    else{ bird.flapping=false; }

    if(bird.y+bird.radius>height){ bird.y=height-bird.radius; gameOver();}
    if(bird.y-bird.radius<0){ bird.y=bird.radius; bird.velocity=0;}

    drawBird();

    if(frameCount%tubeFrequency===0) createTube();
    tubes.forEach((tube,index)=>{
      tube.x-=tubeSpeed;
      drawTube(tube);
      if(detectCollision(bird,tube)) gameOver();
      if(!tube.passed && tube.x+tubeWidth<bird.x){ 
        score++; tube.passed=true; if(score%5===0) tubeSpeed+=0.5;
      }
      if(tube.x+tubeWidth<0) tubes.splice(index,1);
    });
    document.getElementById('score').innerText="Score: "+score;
    frameCount++;
  }

  requestAnimationFrame(update);
}

// Start screen
function showStartScreen(){
  ctx.clearRect(0,0,width,height);
  drawClouds();
  drawBird();
  const msg=document.getElementById('message');
  msg.innerHTML=`
    <div>Mark's Flappy Bird</div>
    <div>High Score: ${highScore}</div>
    <button id="startBtn">Start Game</button>
    <button onclick="showUploadScore()">Upload Score</button>
    <button onclick="showLeaderboard()">Leaderboard</button>
  `;
  document.getElementById('highScore').innerText="High Score: "+highScore;
  const startBtn=document.getElementById('startBtn');
  startBtn.addEventListener('click', startGame);
  startBtn.addEventListener('touchend', startGame);
}

// Start game
function startGame(){
  gameState="playing";
  document.getElementById('message').innerHTML='';
  bird.y=height/2; bird.velocity=0; tubes=[]; score=0; tubeSpeed=3; frameCount=0;
}

// Game over
function gameOver(){
  gameState="gameover";
  if(score>highScore){ highScore=score; localStorage.setItem('flappyHighScore',highScore);}
  const msg=document.getElementById('message');
  msg.innerHTML=`
    <div>Game Over</div>
    <div>Final Score: ${score}</div>
    <button onclick="startGame()">Restart</button>
    <button onclick="showUploadScore()">Upload Score</button>
    <button onclick="showStartScreen()">Home</button>
  `;
}

// Upload score
function showUploadScore(){
  const msg=document.getElementById('message');
  msg.innerHTML=`
    <div>Upload Score</div>
    <div>Final Score: ${score}</div>
    <input type="text" id="playerName" placeholder="Enter your name">
    <button onclick="submitScore()">Submit</button>
    <button onclick="showStartScreen()">Cancel</button>
  `;
}

// Submit score
function submitScore(){
  const input=document.getElementById('playerName');
  let name=input.value.trim();
  if(name===""){ alert("Enter a name!"); return;}
  let scores=JSON.parse(localStorage.getItem('flappyLeaderboard')||"[]");
  const existing=scores.find(s=>s.name===name);
  if(existing){ if(score>existing.score) existing.score=score; }
  else{ scores.push({name:name,score:score}); }
  scores.sort((a,b)=>b.score-a.score);
  if(scores.length>10) scores=scores.slice(0,10);
  localStorage.setItem('flappyLeaderboard',JSON.stringify(scores));
  showLeaderboard();
}

// Leaderboard
function showLeaderboard(){
  let scores=JSON.parse(localStorage.getItem('flappyLeaderboard')||"[]");
  const medal=['🥇','🥈','🥉'];
  let list=scores.map((s,i)=>`${i<3?medal[i]+' ':''}${s.name}: ${s.score}`).join("<br>");
  if(list==="") list="No scores yet!";
  const msg=document.getElementById('message');
  msg.innerHTML=`
    <div>Leaderboard</div>
    <div id="leaderboardList">${list}</div>
    <button onclick="showStartScreen()">Back</button>
    <button onclick="clearLeaderboard()">Clear Leaderboard</button>
  `;
}

// Clear leaderboard
function clearLeaderboard(){
  if(confirm("Are you sure you want to clear the leaderboard?")){
    localStorage.removeItem('flappyLeaderboard');
    showLeaderboard();
  }
}

update();
window.addEventListener('resize',()=>{
  width=window.innerWidth; height=window.innerHeight;
  canvas.width=width; canvas.height=height;
});
</script>
</body>
</html>
