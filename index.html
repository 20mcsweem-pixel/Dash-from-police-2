<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird Clone</title>
<style>
  body {
    margin: 0;
    background: #70c5ce;
    overflow: hidden;
    font-family: sans-serif;
  }
  canvas {
    display: block;
    background: linear-gradient(to bottom, #70c5ce, #ffffff);
  }
  #score, #message {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 24px;
    color: #fff;
    text-shadow: 2px 2px #000;
  }
  #message {
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    text-align: center;
  }
  button {
    font-size: 24px;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 20px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="score">Score: 0</div>
<div id="message"></div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

let gameState = "start"; // "start", "playing", "gameover"
let score = 0;

// Bird
const bird = {
  x: 80,
  y: height / 2,
  radius: 20,
  color: 'yellow',
  velocity: 0,
  gravity: 0.5, // slower falling speed
  jumpPower: -15
};

// Tubes
let tubes = [];
const tubeWidth = 80;
const tubeGap = 200;
let tubeFrequency = 120; // frames
let frameCount = 0;

// Create tubes
function createTube() {
  const minHeight = 50;
  const maxHeight = height - tubeGap - 50;
  const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
  const bottomY = topHeight + tubeGap;
  const bottomHeight = height - bottomY;
  tubes.push({
    x: width,
    top: { y: 0, height: topHeight },
    bottom: { y: bottomY, height: bottomHeight },
    passed: false
  });
}

// Controls
function jump() {
  if (gameState === "playing") {
    bird.velocity = bird.jumpPower;
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') jump();
});
window.addEventListener('touchstart', e => {
  jump();
});

// Collision
function detectCollision(bird, tube) {
  const bx = bird.x;
  const by = bird.y;
  const r = bird.radius;
  if (bx + r > tube.x && bx - r < tube.x + tubeWidth && by - r < tube.top.height) return true;
  if (bx + r > tube.x && bx - r < tube.x + tubeWidth && by + r > tube.bottom.y) return true;
  return false;
}

// Game loop
function update() {
  ctx.clearRect(0, 0, width, height);

  if (gameState === "start") {
    showStartScreen();
    requestAnimationFrame(update);
    return;
  }

  if (gameState === "playing") {
    // Bird physics
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y + bird.radius > height) {
      bird.y = height - bird.radius;
      gameOver();
    }
    if (bird.y - bird.radius < 0) {
      bird.y = bird.radius;
      bird.velocity = 0;
    }

    // Draw bird
    ctx.fillStyle = bird.color;
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fill();

    // Tubes
    if (frameCount % tubeFrequency === 0) createTube();
    tubes.forEach((tube, index) => {
      tube.x -= 5;

      ctx.fillStyle = 'green';
      ctx.fillRect(tube.x, tube.top.y, tubeWidth, tube.top.height);
      ctx.fillRect(tube.x, tube.bottom.y, tubeWidth, tube.bottom.height);

      if (detectCollision(bird, tube)) gameOver();

      if (!tube.passed && tube.x + tubeWidth < bird.x) {
        score++;
        tube.passed = true;
      }

      if (tube.x + tubeWidth < 0) tubes.splice(index, 1);
    });

    document.getElementById('score').innerText = "Score: " + score;
    frameCount++;
  }

  requestAnimationFrame(update);
}

// Start screen
function showStartScreen() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = 'yellow';
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
  ctx.fill();

  const messageDiv = document.getElementById('message');
  messageDiv.innerHTML = `
    <div>Flappy Bird Clone</div>
    <button onclick="startGame()">Start Game</button>
  `;
}

// Start game
function startGame() {
  gameState = "playing";
  document.getElementById('message').innerHTML = '';
  bird.y = height / 2;
  bird.velocity = 0;
  tubes = [];
  score = 0;
  frameCount = 0;
}

// Game over
function gameOver() {
  gameState = "gameover";
  const messageDiv = document.getElementById('message');
  messageDiv.innerHTML = `
    <div>Game Over</div>
    <div>Final Score: ${score}</div>
    <button onclick="startGame()">Restart</button>
  `;
}

update();

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
});
</script>
</body>
</html>
