<!--
2D Random Track Racing Game with Mouse Clicks
WASD controls + mouse click for acceleration
-->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2D Random Track Racing (WASD + Mouse)</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  #ui{position:fixed;left:8px;top:8px;background:rgba(0,0,0,0.5);color:#fff;padding:8px;border-radius:6px;z-index:20}
  canvas{display:block;background:#1b2735;width:100vw;height:100vh}
  .muted{opacity:0.8;font-size:13px}
  .tiny{font-size:12px}
</style>
</head>
<body>
<div id="ui">
  <div><strong>2D Random Track Racing</strong> <span class="tiny muted">(now mouse-enabled)</span></div>
  <div class="muted tiny">Controls: W accelerate, S brake, A/D steer, click to accelerate.</div>
  <div id="status" class="tiny"></div>
</div>
<canvas id="c"></canvas>
<script>
const IMG_URL = 'https://www.carsized.com/resources/nissan/cube/d/2008/sl_279109089_nissan-cube-2008-side-view_4x.png';
const NUM_AI = 5;
const TRACK_POINTS = 18;
const TRACK_DETAIL = 600;
const TRACK_RADIUS = 350;
const TRACK_VARIANCE = 0.32;
const TRACK_WIDTH = 80;

function rand(a,b){return a + Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function angleDiff(a,b){let d=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI;return d;}
function distance(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function lerp(a,b,t){return a+(b-a)*t}
function catmullRom(p0,p1,p2,p3,t){return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',resize);
resize();

function generateRadialTrack(cx,cy,pts,baseRadius,variance){
  const controls=[];
  for(let i=0;i<pts;i++){const angle=(i/pts)*(Math.PI*2);const r=baseRadius*(1+(Math.random()*2-1)*variance);controls.push({x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r});}
  const sampled=[];
  for(let i=0;i<TRACK_DETAIL;i++){const t=i/TRACK_DETAIL*pts;const idx=Math.floor(t);const f=t-idx;
    const p0=controls[(idx-1+pts)%pts];const p1=controls[idx%pts];const p2=controls[(idx+1)%pts];const p3=controls[(idx+2)%pts];
    const x=catmullRom(p0.x,p1.x,p2.x,p3.x,f);const y=catmullRom(p0.y,p1.y,p2.y,p3.y,f);sampled.push({x,y});}
  return sampled;
}
function computeWaypoints(centerline,step){const w=[];for(let i=0;i<centerline.length;i+=step){w.push(centerline[i]);}return w;}

class Car{
  constructor(x,y,angle,color,isPlayer=false){this.x=x;this.y=y;this.angle=angle;this.speed=0;this.color=color;this.width=40;this.height=20;
    this.maxSpeed=250;this.accel=220;this.turnRate=3.2;this.brake=360;this.isPlayer=isPlayer;this.waypointIndex=0;this.laps=0;this.finished=false;}
  update(dt,controls,waypoints,others){
    if(this.isPlayer){
      const steer=(controls.left?-1:0)+(controls.right?1:0);
      this.angle+=steer*this.turnRate*dt*(1-Math.min(0.7,Math.abs(this.speed)/this.maxSpeed));
      if(controls.acc) this.speed+=this.accel*dt*(controls.boost?1.8:1);
      if(controls.brk) this.speed-=this.brake*dt;
    } else {
      const target=waypoints[this.waypointIndex];
      const desired=Math.atan2(target.y-this.y,target.x-this.x);
      const diff=angleDiff(this.angle,desired);
      const steer=clamp(diff*2.0,-1,1);
      this.angle+=steer*this.turnRate*dt;
      const turnFactor=1-Math.min(0.8,Math.abs(diff)/(Math.PI));
      const targetSpeed=this.maxSpeed*(0.35+0.65*turnFactor);
      if(this.speed<targetSpeed)this.speed+=this.accel*dt*0.8;else this.speed-=this.brake*dt*0.5;
      if(distance(this.x,this.y,target.x,target.y)<60)this.waypointIndex=(this.waypointIndex+1)%waypoints.length;
      for(const o of others){if(o===this)continue;const d=distance(this.x,this.y,o.x,o.y);if(d<45)this.speed-=(45-d)*6*dt;}
    }
    this.speed=clamp(this.speed,-80,this.maxSpeed);
    this.x+=Math.cos(this.angle)*this.speed*dt;
    this.y+=Math.sin(this.angle)*this.speed*dt;
  }
}

function randomColor(){const r=Math.floor(rand(40,230)),g=Math.floor(rand(40,230)),b=Math.floor(rand(40,230));return `rgb(${r},${g},${b})`;}

const carImg=new Image();carImg.crossOrigin='anonymous';carImg.src=IMG_URL;

let centerline=[],waypoints=[],cars=[],playerControls={acc:false,brk:false,left:false,right:false,boost:false};

function resetScene(){
  const cx=innerWidth/2,cy=innerHeight/2;
  centerline=generateRadialTrack(cx,cy,TRACK_POINTS,TRACK_RADIUS,TRACK_VARIANCE);
  waypoints=computeWaypoints(centerline,Math.max(2,Math.floor(centerline.length/60)));
  cars=[];
  const start=centerline[0],next=centerline[20%centerline.length];
  const startAngle=Math.atan2(next.y-start.y,next.x-start.x);
  cars.push(new Car(start.x-Math.cos(startAngle)*TRACK_WIDTH*0.5,start.y-Math.sin(startAngle)*TRACK_WIDTH*0.5,startAngle,'#00FFAA',true));
  for(let i=0;i<NUM_AI;i++){const p=centerline[Math.floor((i+1)*centerline.length/(NUM_AI+1))];
    cars.push(new Car(p.x+Math.cos(startAngle)*TRACK_WIDTH*(0.3+i*0.12),p.y+Math.sin(startAngle)*TRACK_WIDTH*(0.3+i*0.12),startAngle,randomColor(),false));}
}

resetScene();

addEventListener('keydown',e=>{if(e.key==='w'||e.key==='W')playerControls.acc=true;if(e.key==='s'||e.key==='S')playerControls.brk=true;
if(e.key==='a'||e.key==='A')playerControls.left=true;if(e.key==='d'||e.key==='D')playerControls.right=true;
if(e.key==='Shift')playerControls.boost=true;if(e.key==='r'||e.key==='R')resetScene();});
addEventListener('keyup',e=>{if(e.key==='w'||e.key==='W')playerControls.acc=false;if(e.key==='s'||e.key==='S')playerControls.brk=false;
if(e.key==='a'||e.key==='A')playerControls.left=false;if(e.key==='d'||e.key==='D')playerControls.right=false;
if(e.key==='Shift')playerControls.boost=false;});

canvas.addEventListener('mousedown',()=>{playerControls.acc=true;});
canvas.addEventListener('mouseup',()=>{playerControls.acc=false;});
canvas.addEventListener('touchstart',(e)=>{e.preventDefault();playerControls.acc=true;});
canvas.addEventListener('touchend',(e)=>{e.preventDefault();playerControls.acc=false;});

let last=performance.now();
function loop(t){const dt=Math.min(0.032,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function update(dt){for(const c of cars)c.update(dt,playerControls,waypoints,cars);}

function render(){ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#0d1620';ctx.fillRect(0,0,innerWidth,innerHeight);
ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=TRACK_WIDTH;ctx.strokeStyle='#7b7b7b';ctx.beginPath();
for(let i=0;i<centerline.length;i++){const p=centerline[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}ctx.closePath();ctx.stroke();
ctx.lineWidth=8;ctx.strokeStyle='#2b3a2f';ctx.beginPath();for(let i=0;i<centerline.length;i++){const p=centerline[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}ctx.closePath();ctx.stroke();
for(let i=0;i<waypoints.length;i+=4){const w=waypoints[i];ctx.fillStyle='rgba(255,255,255,0.06)';ctx.beginPath();ctx.arc(w.x,w.y,4,0,Math.PI*2);ctx.fill();}
for(const c of cars)drawCar(c);
const status=document.getElementById('status');const p=cars[0];status.innerHTML=`Player speed: ${Math.round(p.speed)} px/s &nbsp; Laps: ${p.laps}`;}

function drawCar(c){ctx.save();ctx.translate(c.x,c.y+6);ctx.rotate(c.angle);ctx.globalAlpha=0.14;ctx.fillStyle='#000';ctx.fillRect(-c.width/2,-c.height/2,c.width,c.height);ctx.restore();ctx.globalAlpha=1;
if(carImg.complete&&carImg.naturalWidth){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle+Math.PI);const scale=Math.min(1.2,c.width*1.6/carImg.naturalWidth);const iw=carImg.naturalWidth*scale,ih=carImg.naturalHeight*scale;ctx.drawImage(carImg,-iw/2,-ih/2,iw,ih);ctx.restore();}else{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);ctx.fillStyle=c.color;ctx.fillRect(-c.width/2,-c.height/2,c.width,c.height);ctx.restore();}}
