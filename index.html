<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash from the Police</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #87ceeb;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: linear-gradient(to top, #87ceeb, #ffffff);
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: #fff;
      text-shadow: 2px 2px #000;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // Player
    const player = {
      x: 50,
      y: height - 150,
      width: 50,
      height: 50,
      color: 'red',
      velocityY: 0,
      gravity: 1.2,
      jumpPower: -20,
      onGround: false
    };

    let obstacles = [];
    let handcuffs = [];
    let obstacleFrequency = 90; // frames
    let handcuffFrequency = 200;
    let frameCount = 0;
    let score = 0;

    function createObstacle() {
      const heightObstacle = Math.random() * 100 + 50;
      obstacles.push({
        x: width,
        y: height - heightObstacle,
        width: 50,
        height: heightObstacle,
        color: 'black'
      });
    }

    function createHandcuff() {
      const yPos = Math.random() * (height - 200) + 50;
      handcuffs.push({
        x: width,
        y: yPos,
        width: 30,
        height: 30,
        color: 'gold'
      });
    }

    function jump() {
      if (player.onGround) {
        player.velocityY = player.jumpPower;
        player.onGround = false;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') jump();
    });

    window.addEventListener('touchstart', e => {
      jump();
    });

    function detectCollision(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    function update() {
      ctx.clearRect(0, 0, width, height);

      // Player physics
      player.velocityY += player.gravity;
      player.y += player.velocityY;

      if (player.y + player.height >= height - 100) {
        player.y = height - 100 - player.height;
        player.velocityY = 0;
        player.onGround = true;
      }

      // Draw player
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Obstacles
      if (frameCount % obstacleFrequency === 0) createObstacle();
      obstacles.forEach((obs, index) => {
        obs.x -= 7;
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        if (detectCollision(player, obs)) {
          alert("Game Over! Score: " + score);
          document.location.reload();
        }

        if (obs.x + obs.width < 0) {
          obstacles.splice(index, 1);
        }
      });

      // Handcuffs
      if (frameCount % handcuffFrequency === 0) createHandcuff();
      handcuffs.forEach((hc, index) => {
        hc.x -= 7;
        ctx.fillStyle = hc.color;
        ctx.fillRect(hc.x, hc.y, hc.width, hc.height);

        if (detectCollision(player, hc)) {
          score += 10;
          handcuffs.splice(index, 1);
        }

        if (hc.x + hc.width < 0) {
          handcuffs.splice(index, 1);
        }
      });

      document.getElementById('score').innerText = "Score: " + score;

      frameCount++;
      requestAnimationFrame(update);
    }

    update();

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });
  </script>
</body>
</html>
